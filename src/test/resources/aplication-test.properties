spring.datasource.url=jdbc:mysql://localhost:3306/elitemacro_testdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=olenomemes123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration para pruebas
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Deshabilitar validación para pruebas
spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.javax.persistence.validation.mode=none

# Configuración de conexión
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Deshabilitar seguridad para pruebas (opcional)
spring.main.allow-bean-definition-overriding=true

# Configuración de logging para pruebas
logging.level.com.example.EliteMacro=DEBUG
logging.level.org.springframework.test.context=WARN

# Configuración específica para tests
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=true