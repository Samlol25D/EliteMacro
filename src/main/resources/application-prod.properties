# src/main/resources/application-prod.properties
# Configuración para RENDER con PostgreSQL

# PostgreSQL de Render (DATABASE_URL se inyecta automáticamente)
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=2

# JPA para PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Server port para Render (Render inyecta PORT)
server.port=${PORT:8080}

# Email con variables de entorno
spring.mail.username=${EMAIL_USERNAME:samlol25d@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:olenomemes123}

