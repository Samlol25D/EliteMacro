<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro | EliteMacro</title>
  <link rel="stylesheet" href="css/registro_style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="form-container">
  <h2>Crear Cuenta</h2>
  <form method="post" action="/api/registro">
    <div class="input-group">
      <i class="fas fa-user"></i>
      <input type="text" name="username" placeholder="Nombre de usuario" required>
    </div>
    <div class="input-group">
      <i class="fas fa-envelope"></i>
      <input type="email" name="email" placeholder="Correo electrónico" required>
    </div>
    <div class="input-group">
      <i class="fas fa-lock"></i>
      <input type="password" name="password" placeholder="Contraseña" required>
    </div>
    <button type="submit" class="btn-primary">Registrarse</button>
  </form>
  <div class="option">
    <a href="login.html">¿Ya tienes cuenta?</a>
  </div>
  <a href="home.html" class="btn-secondary">Volver a la página principal</a>
</div>
<script src="js/registro.js">
</script>
</body>
</html>
