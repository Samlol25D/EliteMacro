<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/login_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Recuperar Contraseña | EliteMacro</title>
</head>
<body>
<div class="login-container">
    <h2>Recuperar Contraseña</h2>
    <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>

    <form id="forgotPasswordForm">
        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="Correo electrónico" required>
        </div>
        <button type="submit" class="btn-login">Enviar enlace</button>
    </form>

    <div id="message" class="message"></div>

    <div class="options">
        <a href="login.html">Volver al inicio de sesión</a>
    </div>
    <a href="home.html" class="btn-secondary">Volver a la página principal</a>
</div>

<script src="js/pass.js"></script>
</body>
</html>
