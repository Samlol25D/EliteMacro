<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/login_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Nueva Contraseña | EliteMacro</title>
</head>
<body>
<div class="login-container">
    <h2>Nueva Contraseña</h2>
    <p>Crea una nueva contraseña para tu cuenta.</p>

    <form id="resetPasswordForm">
        <input type="hidden" id="token" value="">
        <input type="hidden" id="email" value="">

        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="newPassword" placeholder="Nueva contraseña" required minlength="6">
        </div>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required minlength="6">
        </div>
        <button type="submit" class="btn-login">Cambiar contraseña</button>
    </form>

    <div id="message" class="message"></div>

    <div class="options">
        <a href="login.html">Volver al inicio de sesión</a>
    </div>
</div>

<script src="js/respassword.js">
</script>
</body>
</html>
