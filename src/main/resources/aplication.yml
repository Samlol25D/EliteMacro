spring:
  application:
    name: EliteMacro

  jackson:
    serialization:
      fail-on-empty-beans: false
    default-property-inclusion: non_null

  logging:
    level:
      com.example.EliteMacro.elitemacro: DEBUG

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

---
# Configuración LOCAL (perfil dev) - MySQL
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/elitemacrodb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: olenomemes123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  mail:
    username: samlol25d@gmail.com
    password: olenomemes123

server:
  port: 8080

---
# Configuración RENDER (perfil prod) - VERSIÓN CORREGIDA
spring:
  config:
    activate:
      on-profile: prod

  # FORZAR PostgreSQL explícitamente
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:elitemacrodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    # ESTAS DOS LÍNEAS SON CLAVE:
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
      maximum-pool-size: 2

  jpa:
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        jdbc:
          lob:
            non-contextual-creation: true
    show-sql: false
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  mail:
    username: ${EMAIL_USERNAME:samlol25d@gmail.com}
    password: ${EMAIL_PASSWORD:olenomemes123}

server:
  port: ${PORT:8080}