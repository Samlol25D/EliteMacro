spring:
  application:
    name: EliteMacro

  # ===== CONFIGURACIÓN DE CORREO =====
  mail:
    host: smtp.gmail.com
    port: 587
    username: samlol25d@gmail.com
    # ¡IMPORTANTE! La contraseña de aplicación SIN ESPACIOS:
    password: sadpsnxmsoyaqufe
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 50000  # Aumentado
          timeout: 50000           # Aumentado
          writetimeout: 50000      # Aumentado

  # ===== CONFIGURACIÓN GENERAL =====
  logging:
    level:
      org.springframework.mail: DEBUG  # Para ver logs de correo
      com.example.EliteMacro: DEBUG

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# ===== PERFIL dev =====
---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/elitemacrodb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: olenomemes123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

server:
  port: 8080

# ===== PERFIL prod =====
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME:elitemacro_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: ${PORT:8080}